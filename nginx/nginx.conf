user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main buffer=16k flush=2s;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # Basic rate limiting for APIs (e.g., 25 req/s per IP with burst 50)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=25r/s;

    # Allow large uploads for document processing
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml;

    # Upstream with HTTP keepalive connection pooling
    upstream nextjs_upstream {
        server host.docker.internal:3000 max_fails=3 fail_timeout=10s;
        # Maintain a pool of up to 64 idle keepalive connections to Next.js
        keepalive 64;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Hide nginx version
        server_tokens off;

        # Defense-in-depth HTTP Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # Cache Next.js static assets for fast browser delivery
        location /_next/static/ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 365d;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Apply rate limiting and keepalive pooling to API routes
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://nextjs_upstream;
            
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffering & timeout adjustments for conversions & uploads
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 15s;
            proxy_send_timeout 300s;
        }

        location / {
            proxy_pass http://nextjs_upstream;
            
            # Use HTTP 1.1 and clear Connection header to enable upstream keepalive pooling
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket/SSE support for live progress streams
            proxy_set_header Upgrade $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 15s;
            proxy_send_timeout 300s;
        }
    }
}
