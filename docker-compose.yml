services:
  redis:
    image: redis:7-alpine
    container_name: fileconvert-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Kolkata
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: fileconvert-gotenberg
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      TZ: Asia/Kolkata
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:stable
    container_name: fileconvert-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    environment:
      TZ: Asia/Kolkata
      CLAMAV_NO_FRESHCLAM: "false"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s
    dns:
      - 8.8.8.8
      - 1.1.1.1

  pdf-converter:
    build:
      context: ./pdf-converter
    container_name: fileconvert-pdf-converter
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Kolkata
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: fileconvert-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - gotenberg
      - clamav
      - pdf-converter

volumes:
  redis_data:
  clamav_data: