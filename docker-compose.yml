services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    container_name: fileconvert-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      TZ: Asia/Kolkata
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    security_opt:
      - no-new-privileges:true
    init: true
    mem_limit: 1g
    container_name: fileconvert-gotenberg
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      TZ: Asia/Kolkata
    command:
      - "gotenberg"
      - "--api-timeout=120s"
      # Keep LibreOffice process alive between conversions (avoids 8-15s cold-start penalty)
      - "--libreoffice-start-timeout=30s"
      # Restart LibreOffice every 20 conversions to prevent memory bloat while staying warm
      - "--libreoffice-restart-after=20"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:1.4
    security_opt:
      - no-new-privileges:true
    init: true
    mem_limit: 2g
    container_name: fileconvert-clamav
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    environment:
      TZ: Asia/Kolkata
      CLAMAV_NO_FRESHCLAM: "false"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s
    dns:
      - 8.8.8.8
      - 1.1.1.1

  pdf-converter:
    build:
      context: ./pdf-converter
    container_name: fileconvert-pdf-converter
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TZ: Asia/Kolkata
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: worker.Dockerfile
    container_name: fileconvert-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Kolkata
      # Override service URLs to use Docker internal hostnames
      REDIS_URL: redis://redis:6379
      CLAMAV_HOST: clamav
      GOTENBERG_URL: http://gotenberg:3000
      PDF_CONVERTER_URL: http://pdf-converter:8080
    depends_on:
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      pdf-converter:
        condition: service_healthy
      clamav:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const procs=fs.readdirSync('/proc').filter(f=>/^\\d+$/.test(f));const alive=procs.some(p=>{try{return fs.readFileSync('/proc/'+p+'/cmdline','utf8').includes('orchestrator')}catch{return false}});process.exit(alive?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: fileconvert-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - gotenberg
      - clamav
      - worker

volumes:
  redis_data:
  clamav_data:
